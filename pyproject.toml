[project]
name = "my-ai-app"
version = "0.1.0"
description = "My first production Python Service"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.5",
    "apscheduler>=3.11.3",
    "connectorx>=0.4.5",
    "fastapi>=0.140.0",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "openai>=3.35.1",
    "pandas[postgresql]>=3.0.5",
    "pgvector>=0.5.1",
    "polars>=1.43.1",
    "psycopg[binary]>=3.3.4",
    "pyarrow>=25.0.0",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "sentence-transformers>=6.2.0",
    "sqlalchemy>=2.0.51",
    "statsmodels>=0.14.6",
    "tenacity>=9.1.4",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "uvicorn[standard]>=0.51.0",
    "xgboost>=3.2.0",
]

[[tool.mypy.overrides]]
module = ["sklearn.*", "pandas.*", "apscheduler.*", "joblib.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"
# learn/ holds practice scripts from the curriculum, kept out of strict checks
extend-exclude = ["docs", "src/my_ai_app/learn"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["src/my_ai_app/learn/"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
markers = ["integration: needs a running Postgres database"]
