[project]
name = "my-ai-app"
version = "0.1.0"
description = "My first production Python Service"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.5",
    "apscheduler>=3.11.3",
    "connectorx>=0.4.5",
    "fastapi>=0.140.0",
    "httpx>=0.28.1",
    "pandas[postgresql]>=3.0.5",
    "polars>=1.43.1",
    "psycopg[binary]>=3.3.4",
    "pyarrow>=25.0.0",
    "pydantic-settings>=2.14.2",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.51",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
